<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload de Arquivos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#1e293b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:40px;
    border-radius:20px;
    width:450px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    margin-bottom:20px;
}

input{
    margin:20px 0;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#info{
    margin-top:20px;
    color:#555;
}
</style>

</head>
<body>

<div class="card">

<h1>Upload de Arquivo</h1>

<input type="file" id="arquivo">

<br>

<button onclick="baixar()">Baixar Arquivo</button>

<p id="info"></p>

</div>

<script>

let arquivoSelecionado;

document.getElementById("arquivo").addEventListener("change",function(){

arquivoSelecionado=this.files[0];

if(arquivoSelecionado){

document.getElementById("info").innerHTML=
"Arquivo: <b>"+arquivoSelecionado.name+
"</b><br>Tamanho: "+
(arquivoSelecionado.size/1024).toFixed(2)+" KB";

}

});

function baixar(){

if(!arquivoSelecionado){

alert("Escolha um arquivo.");

return;

}

const url=URL.createObjectURL(arquivoSelecionado);

const a=document.createElement("a");

a.href=url;

a.download=arquivoSelecionado.name;

a.click();

URL.revokeObjectURL(url);

}

</script>

</body>
</html>
