<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mashle • 1ª Temporada • Playlist</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a0033, #330066);
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
    }
    header {
      padding: 40px 20px;
      background: rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 3rem;
      margin: 0;
      text-shadow: 0 0 20px #ff00aa;
    }
    h2 {
      color: #ff99cc;
      margin-top: 10px;
    }
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }
    .music-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 15px;
      margin: 15px 0;
      display: flex;
      align-items: center;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }
    .music-card:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.03);
    }
    .music-card img {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      margin-right: 20px;
      object-fit: cover;
    }
    .info {
      flex: 1;
      text-align: left;
    }
    .info h3 {
      margin: 0;
      font-size: 1.3rem;
    }
    .info p {
      margin: 5px 0 0 0;
      color: #ddd;
    }
    audio {
      width: 100%;
      margin-top: 10px;
    }
    footer {
      margin-top: 50px;
      padding: 20px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <header>
    <h1>♪ Mashle: Magic and Muscles ♪</h1>
    <h2>1ª Temporada - Playlist Completa</h2>
  </header>

  <div class="container">

    <!-- Exemplo de música (substitua pelos links reais) -->
    <div class="music-card">
      <img src="https://i.imgur.com/0zY8Z8k.jpg" alt="Mashle Cover">
      <div class="info">
        <h3>1. Mashle Opening - Knock Out</h3>
        <p>Por: Taiyō no Ao (太陽の青)</p>
      </div>
      <audio controls>
        <source src="SEU_LINK_DA_MUSICA_AQUI.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
      </audio>
    </div>

    <div class="music-card">
      <img src="https://i.imgur.com/0zY8Z8k.jpg" alt="Mashle Cover">
      <div class="info">
        <h3>2. Mashle Ending - Waai Waai Waai</h3>
        <p>Por: MAISONdes</p>
      </div>
      <audio controls>
        <source src="SEU_LINK_DA_MUSICA_AQUI.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
      </audio>
    </div>

    <!-- Adicione mais músicas aqui repetindo o bloco acima -->

  </div>

  <footer>
    <p>Site feito com amor para os fãs de Mashle • 1ª Temporada</p>
    <p>Não sou afiliado ao anime ou estúdio</p>
  </footer>

</body>
</html>
