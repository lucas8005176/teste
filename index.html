<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa do Mundo 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#020617;
    color:white;
    min-height:100vh;
    padding:20px;
    background-image: radial-gradient(circle at top,#0f172a,#020617);
}

/* TOPO */
.topo{
    text-align:center;
    margin-bottom:30px;
}

.topo h1{
    font-size:60px;
    color:white;
    text-shadow:0 0 20px #38bdf8;
}

.linha{
    width:100%;
    height:5px;
    background:linear-gradient(to right, green, blue, red, yellow);
    margin-top:15px;
}

/* CONTAINER */
.container{
    display:flex;
    gap:20px;
    align-items:flex-start;
}

/* GRUPOS */
.grupos{
    width:70%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.grupo{
    background:#0f172a;
    border:1px solid #334155;
    border-radius:15px;
    padding:15px;
    transition:0.3s;
    min-height:260px;
}

.grupo:hover{
    transform:translateY(-5px);
    box-shadow:0 0 15px #38bdf8;
}

.grupo h2{
    text-align:center;
    margin-bottom:15px;
    color:#38bdf8;
    font-size:22px;
}

.time{
    padding:12px;
    margin:8px 0;
    background:#111827;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
    border:1px solid transparent;
}

.time:hover{
    background:#16a34a;
    transform:scale(1.03);
    border-color:#22c55e;
}

/* LATERAL */
.info{
    width:30%;
    background:#0f172a;
    border-radius:20px;
    padding:20px;
    border:1px solid #334155;
    position:sticky;
    top:20px;
    height:fit-content;
}

.info h2{
    color:#38bdf8;
    margin-bottom:20px;
    font-size:35px;
}

.info h3{
    margin-top:20px;
    margin-bottom:10px;
}

.titulares{
    color:#4ade80;
}

.banco{
    color:#facc15;
}

li{
    margin:7px 0;
}

/* RESPONSIVO */
@media(max-width:1200px){
    .container{
        flex-direction:column;
    }

    .grupos{
        width:100%;
        grid-template-columns:repeat(2,1fr);
    }

    .info{
        width:100%;
        position:static;
    }
}

@media(max-width:700px){
    .grupos{
        grid-template-columns:1fr;
    }

    .topo h1{
        font-size:40px;
    }
}
</style>
</head>

<body>

<div class="topo">
    <h1>🏆 COPA DO MUNDO 2026</h1>
    <div class="linha"></div>
</div>

<div class="container">

    <!-- GRUPOS -->
    <div class="grupos" id="grupos"></div>

    <!-- LATERAL -->
    <div class="info">
        <h2 id="nomeTime">Selecione uma seleção</h2>

        <h3 class="titulares">Informações</h3>
        <ul id="titularesLista">
            <li>Clique em uma seleção</li>
        </ul>

        <h3 class="banco">Observações</h3>
        <ul id="bancoLista">
            <li>Os grupos aparecem ao lado</li>
        </ul>
    </div>

</div>

<script>
const gruposData = [
    { nome: "GRUPO A", times: ["Canadá", "Japão", "Marrocos", "Noruega"] },
    { nome: "GRUPO B", times: ["México", "Irã", "Egito", "Áustria"] },
    { nome: "GRUPO C", times: ["Estados Unidos", "Austrália", "Argélia", "Bélgica"] },
    { nome: "GRUPO D", times: ["Argentina", "Coreia do Sul", "Cabo Verde", "Croácia"] },
    { nome: "GRUPO E", times: ["Brasil", "Qatar", "Congo DR", "Tchéquia"] },
    { nome: "GRUPO F", times: ["Colômbia", "Arábia Saudita", "Tunísia", "Inglaterra"] },
    { nome: "GRUPO G", times: ["Equador", "Jordânia", "Gana", "França"] },
    { nome: "GRUPO H", times: ["Uruguai", "Uzbequistão", "Costa do Marfim", "Alemanha"] },
    { nome: "GRUPO I", times: ["Paraguai", "África do Sul", "Senegal", "Países Baixos"] },
    { nome: "GRUPO J", times: ["Nova Zelândia", "Panamá", "Bósnia e Herzegovina", "Portugal"] },
    { nome: "GRUPO K", times: ["Curaçao", "Haiti", "Escócia", "Espanha"] },
    { nome: "GRUPO L", times: ["Suíça", "Turquia", "Suécia", "Iraque"] }
];

const timeParaGrupo = {};

function gerarGrupos(){
    const gruposContainer = document.getElementById("grupos");
    gruposContainer.innerHTML = "";

    gruposData.forEach(grupo => {
        const bloco = document.createElement("div");
        bloco.className = "grupo";

        const titulo = document.createElement("h2");
        titulo.textContent = grupo.nome;
        bloco.appendChild(titulo);

        grupo.times.forEach(time => {
            timeParaGrupo[time] = grupo.nome;

            const item = document.createElement("div");
            item.className = "time";
            item.textContent = time;
            item.addEventListener("click", () => mostrarTime(time));
            bloco.appendChild(item);
        });

        gruposContainer.appendChild(bloco);
    });
}

function mostrarTime(time){
    const grupo = timeParaGrupo[time] || "Não encontrado";

    document.getElementById("nomeTime").textContent = time;

    document.getElementById("titularesLista").innerHTML = `
        <li>Seleção: ${time}</li>
        <li>Grupo: ${grupo}</li>
    `;

    document.getElementById("bancoLista").innerHTML = `
        <li>Classificada para a Copa do Mundo 2026</li>
        <li>Os detalhes finais podem ser atualizados depois</li>
    `;
}

gerarGrupos();
</script>

</body>
</html>
