<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Copa do Mundo 2026</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    :root{
        --azul:#38bdf8;
        --verde:#22c55e;
        --amarelo:#facc15;
        --fundo:#020617;
    }

    body{
        min-height:100vh;
        background:
            radial-gradient(circle at top, #0f172a 0%, var(--fundo) 55%);
        color:#fff;
        padding:20px;
        overflow-x:hidden;
        position:relative;
    }

    body::before,
    body::after{
        content:"";
        position:fixed;
        inset:-20%;
        pointer-events:none;
        z-index:-1;
    }

    body::before{
        background:
            radial-gradient(circle at 20% 20%, rgba(56,189,248,.10), transparent 24%),
            radial-gradient(circle at 80% 30%, rgba(168,85,247,.10), transparent 22%),
            radial-gradient(circle at 50% 80%, rgba(34,197,94,.10), transparent 24%);
        animation:flutuarFundo 14s ease-in-out infinite alternate;
    }

    body::after{
        background-image: radial-gradient(rgba(255,255,255,.18) 1px, transparent 1px);
        background-size: 28px 28px;
        opacity:.13;
        animation: estrelas 16s linear infinite;
    }

    .topo{
        text-align:center;
        margin-bottom:20px;
        animation: aparecer .8s ease both;
    }

    .topo h1{
        font-size:clamp(34px, 5vw, 64px);
        font-weight:800;
        text-shadow:0 0 18px rgba(56,189,248,.55);
        margin-bottom:14px;
        animation:pulsarTitulo 2.8s ease-in-out infinite;
    }

    .linha{
        width:100%;
        height:5px;
        border-radius:999px;
        background:linear-gradient(90deg,#22c55e,#3b82f6,#a855f7,#ef4444,#facc15);
        box-shadow:0 0 12px rgba(56,189,248,.35);
        background-size:300% 100%;
        animation:gradiente 5s linear infinite;
    }

    .container{
        display:grid;
        grid-template-columns: 1.25fr .95fr;
        gap:20px;
        align-items:start;
    }

    .painel{
        background:rgba(15,23,42,.82);
        border:1px solid rgba(148,163,184,.22);
        border-radius:24px;
        box-shadow:0 20px 50px rgba(0,0,0,.28);
        backdrop-filter: blur(10px);
        animation: subir .7s ease both;
    }

    .esquerda{
        padding:18px;
    }

    .barra-acoes{
        display:flex;
        gap:10px;
        flex-wrap:wrap;
        margin-bottom:16px;
    }

    .barra-acoes input{
        flex:1;
        min-width:220px;
        padding:12px 14px;
        border-radius:14px;
        border:1px solid rgba(148,163,184,.25);
        background:#0b1220;
        color:#fff;
        outline:none;
    }

    .btn{
        border:none;
        border-radius:14px;
        padding:12px 14px;
        cursor:pointer;
        font-weight:700;
        transition:.25s ease;
        position:relative;
        overflow:hidden;
    }

    .btn:hover{
        transform:translateY(-2px);
        filter:brightness(1.05);
    }

    .btn:active{
        transform:translateY(0) scale(.98);
    }

    .btn-azul{ background:#2563eb; color:#fff; }
    .btn-verde{ background:#16a34a; color:#fff; }
    .btn-amarelo{ background:#f59e0b; color:#111827; }
    .btn-cinza{ background:#334155; color:#fff; }

    .titulo-sec{
        color:#38bdf8;
        font-size:22px;
        margin-bottom:14px;
        font-weight:800;
    }

    .grupos{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:14px;
    }

    .grupo{
        background:linear-gradient(180deg, rgba(15,23,42,.98), rgba(2,6,23,.95));
        border:1px solid rgba(148,163,184,.18);
        border-radius:18px;
        padding:14px;
        min-height:230px;
        transition:.25s ease;
        animation: aparecer .5s ease both;
        transform-style:preserve-3d;
        perspective:1000px;
    }

    .grupo:hover{
        transform:translateY(-4px);
        box-shadow:0 0 20px rgba(56,189,248,.18);
        border-color:rgba(56,189,248,.35);
    }

    .grupo h2{
        text-align:center;
        color:#60a5fa;
        font-size:20px;
        margin-bottom:12px;
    }

    .time-wrap{
        perspective:1000px;
        margin-bottom:8px;
    }

    .time{
        width:100%;
        min-height:72px;
        border:none;
        background:none;
        padding:0;
        cursor:pointer;
        position:relative;
        transform-style:preserve-3d;
        transition:transform .7s ease;
        user-select:none;
    }

    .time.virado{
        transform:rotateY(180deg);
    }

    .time-card{
        position:relative;
        width:100%;
        min-height:72px;
        transform-style:preserve-3d;
    }

    .time-face{
        position:absolute;
        inset:0;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        border-radius:14px;
        padding:11px 12px;
        backface-visibility:hidden;
        border:1px solid rgba(148,163,184,.14);
        box-shadow:0 10px 18px rgba(0,0,0,.16);
    }

    .time-front{
        background:#111827;
    }

    .time-back{
        background:linear-gradient(135deg,#2563eb,#22c55e);
        transform:rotateY(180deg);
        color:#fff;
        flex-direction:column;
        gap:4px;
        text-align:center;
    }

    .time:hover .time-front{
        background:#14532d;
        border-color:#22c55e;
    }

    .time.ativo .time-front{
        background:#1d4ed8;
        border-color:#60a5fa;
        box-shadow:0 0 12px rgba(59,130,246,.35);
        animation: brilhoAtivo 1.6s ease-in-out infinite, pulsarSelecao 1.4s ease-in-out infinite;
    }

    .icone-time{ display:inline-block; }

    .placar-mini{
        font-size:20px;
        font-weight:900;
    }

    .placar-mini-texto{
        font-size:12px;
        opacity:.95;
    }

    .ripple{
        position:absolute;
        border-radius:50%;
        transform:scale(0);
        background:rgba(255,255,255,.35);
        animation:ripple .65s ease-out;
        pointer-events:none;
        z-index:4;
    }

    .direita{
        padding:18px;
        position:sticky;
        top:18px;
    }

    .time-selecionado{
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
        gap:12px;
        margin-bottom:12px;
    }

    .time-selecionado h2{
        font-size:34px;
        color:#38bdf8;
        line-height:1;
        animation: aparecer .5s ease both;
    }

    .tag-grupo{
        padding:8px 12px;
        border-radius:999px;
        background:rgba(59,130,246,.18);
        border:1px solid rgba(96,165,250,.25);
        font-size:13px;
        white-space:nowrap;
    }

    .placar{
        margin-bottom:14px;
        padding:14px;
        border-radius:18px;
        background:rgba(2,6,23,.55);
        border:1px solid rgba(255,255,255,.14);
    }

    .placar h3{
        margin-bottom:10px;
        color:#facc15;
        font-size:18px;
    }

    .placar-linha{
        display:grid;
        grid-template-columns:1.4fr .6fr .6fr auto;
        gap:10px;
        align-items:center;
    }

    .placar-linha input{
        width:100%;
        padding:11px 12px;
        border-radius:12px;
        border:1px solid rgba(148,163,184,.24);
        background:#0b1220;
        color:#fff;
        outline:none;
    }

    .placar-box{
        margin-top:10px;
        display:flex;
        justify-content:space-between;
        gap:12px;
        align-items:center;
        flex-wrap:wrap;
        color:#e2e8f0;
    }

    .placar-box strong{
        color:#fff;
        font-size:18px;
        display:inline-block;
        animation: placarPulse 1.2s ease-in-out infinite;
    }

    .placar-box strong.animando{
        animation: placarTroca .35s ease;
    }

    .campo{
        background:linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
        background-size:cover;
        background-position:center;
        border-radius:22px;
        border:4px solid rgba(255,255,255,.22);
        padding:16px;
        min-height:560px;
        position:relative;
        overflow:hidden;
        box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);
        background-blend-mode:overlay;
    }

    .campo::before,
    .campo::after{
        content:"";
        position:absolute;
        inset:16px;
        border:2px solid rgba(255,255,255,.22);
        border-radius:18px;
        pointer-events:none;
    }

    .campo::after{
        inset:50% 16px auto 16px;
        height:2px;
        border:none;
        background:rgba(255,255,255,.22);
        transform:translateY(-1px);
    }

    .meio-campo{
        position:absolute;
        left:50%;
        top:50%;
        width:88px;
        height:88px;
        transform:translate(-50%,-50%);
        border:2px solid rgba(255,255,255,.22);
        border-radius:50%;
        pointer-events:none;
    }

    .formacao{
        position:relative;
        z-index:2;
        display:grid;
        grid-template-rows:repeat(4, 1fr);
        height:380px;
        gap:12px;
        margin-bottom:14px;
    }

    .linha-formacao{
        display:grid;
        gap:10px;
        align-items:center;
        justify-items:center;
    }

    .linha-4{ grid-template-columns:repeat(4,1fr); }
    .linha-3{ grid-template-columns:repeat(3,1fr); }
    .linha-2{ grid-template-columns:repeat(2,1fr); }
    .linha-1{ grid-template-columns:1fr; }

    .jogador{
        width:100%;
        min-width:0;
        max-width:110px;
        padding:10px 8px;
        background:rgba(17,24,39,.88);
        border:1px solid rgba(255,255,255,.16);
        border-radius:14px;
        text-align:center;
        cursor:pointer;
        transition:.22s ease;
        box-shadow:0 8px 18px rgba(0,0,0,.18);
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:6px;
        position:relative;
        overflow:hidden;
        animation: aparecer .45s ease both;
    }

    .jogador:hover{
        transform:translateY(-2px) scale(1.03);
        border-color:rgba(255,255,255,.35);
        box-shadow:0 0 18px rgba(255,255,255,.08);
    }

    .jogador:active{
        transform:scale(.96);
    }

    .jogador.selecionado-jogador{
        outline:2px solid rgba(250,204,21,.8);
        box-shadow:0 0 16px rgba(250,204,21,.22);
    }

    .foto-jogador{
        width:46px;
        height:46px;
        border-radius:50%;
        object-fit:cover;
        border:2px solid rgba(255,255,255,.45);
        background:#0b1220;
        flex-shrink:0;
    }

    .avatar-vazio{
        width:46px;
        height:46px;
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;
        background:rgba(255,255,255,.16);
        border:2px dashed rgba(255,255,255,.45);
        font-size:20px;
        flex-shrink:0;
    }

    .jogador .nome{
        display:block;
        font-weight:700;
        font-size:12px;
        line-height:1.15;
        margin-top:0;
    }

    .jogador .num{
        display:block;
        font-size:11px;
        opacity:.85;
    }

    .jogador.vazio{
        background:rgba(255,255,255,.16);
        color:#e5e7eb;
        border-style:dashed;
    }

    .detalhes{
        position:relative;
        z-index:2;
        background:rgba(2,6,23,.55);
        border:1px solid rgba(255,255,255,.16);
        border-radius:18px;
        padding:14px;
    }

    .detalhes h3{
        margin-bottom:10px;
        font-size:18px;
        color:#facc15;
    }

    .linha-inputs{
        display:grid;
        grid-template-columns:1.2fr .6fr .8fr;
        gap:10px;
        margin-bottom:10px;
    }

    .linha-inputs input,
    .linha-inputs select,
    .linha-fundo input,
    .linha-foto input,
    .placar-linha input{
        width:100%;
        padding:11px 12px;
        border-radius:12px;
        border:1px solid rgba(148,163,184,.24);
        background:#0b1220;
        color:#fff;
        outline:none;
    }

    .linha-foto,
    .linha-fundo{
        display:grid;
        grid-template-columns:1fr auto;
        gap:10px;
        align-items:center;
        margin-bottom:10px;
    }

    .foto-preview{
        width:64px;
        height:64px;
        border-radius:50%;
        border:2px solid rgba(255,255,255,.28);
        object-fit:cover;
        background:#0b1220;
    }

    .foto-preview-vazia{
        width:64px;
        height:64px;
        border-radius:50%;
        border:2px dashed rgba(255,255,255,.28);
        display:flex;
        align-items:center;
        justify-content:center;
        background:rgba(255,255,255,.08);
        font-size:22px;
    }

    .mini-preview-fundo{
        height:44px;
        border-radius:12px;
        border:1px solid rgba(255,255,255,.16);
        background:#0b1220;
        overflow:hidden;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:12px;
        color:#cbd5e1;
        padding:8px 10px;
    }

    .acoes-jogador{
        display:flex;
        gap:10px;
        flex-wrap:wrap;
        margin-bottom:14px;
    }

    .lista{
        display:grid;
        gap:10px;
    }

    .caixa-lista{
        background:rgba(15,23,42,.8);
        border:1px solid rgba(148,163,184,.16);
        border-radius:16px;
        padding:12px;
    }

    .caixa-lista h4{
        margin-bottom:10px;
        color:#4ade80;
        font-size:16px;
    }

    ul{ list-style:none; }

    li{
        padding:8px 10px;
        border-radius:10px;
        background:#111827;
        margin-bottom:8px;
        display:flex;
        justify-content:space-between;
        gap:12px;
        align-items:center;
        cursor:pointer;
        transition:.2s ease;
    }

    li:hover{
        transform:translateX(3px);
        background:#1f2937;
    }

    .mini{
        opacity:.75;
        font-size:12px;
        white-space:nowrap;
    }

    .texto-ajuda{
        font-size:13px;
        opacity:.8;
        line-height:1.4;
        margin-top:6px;
    }

    .vazio-msg{
        opacity:.85;
        font-size:14px;
        padding:8px 0 2px;
    }

    @keyframes aparecer{
        from{ opacity:0; transform:translateY(18px); }
        to{ opacity:1; transform:translateY(0); }
    }

    @keyframes subir{
        from{ opacity:0; transform:translateY(20px) scale(.985); }
        to{ opacity:1; transform:translateY(0) scale(1); }
    }

    @keyframes pulsarTitulo{
        0%,100%{ transform:scale(1); text-shadow:0 0 18px rgba(56,189,248,.55); }
        50%{ transform:scale(1.02); text-shadow:0 0 26px rgba(56,189,248,.85); }
    }

    @keyframes gradiente{
        from{ background-position:0% 50%; }
        to{ background-position:100% 50%; }
    }

    @keyframes flutuarFundo{
        from{ transform:translate3d(0,0,0) scale(1); }
        to{ transform:translate3d(2%,1%,0) scale(1.03); }
    }

    @keyframes estrelas{
        from{ transform:translateY(0); }
        to{ transform:translateY(28px); }
    }

    @keyframes brilhoAtivo{
        0%,100%{ box-shadow:0 0 12px rgba(59,130,246,.35); }
        50%{ box-shadow:0 0 20px rgba(59,130,246,.55); }
    }

    @keyframes pulsarSelecao{
        0%,100%{ box-shadow:0 0 12px rgba(59,130,246,.35); }
        50%{ box-shadow:0 0 24px rgba(59,130,246,.7); }
    }

    @keyframes ripple{
        to{
            transform:scale(18);
            opacity:0;
        }
    }

    @keyframes placarPulse{
        0%,100%{ transform:scale(1); }
        50%{ transform:scale(1.03); }
    }

    @keyframes placarTroca{
        0%{ transform:translateY(0) scale(1); opacity:1; }
        50%{ transform:translateY(-4px) scale(1.08); opacity:.7; }
        100%{ transform:translateY(0) scale(1); opacity:1; }
    }

    @media (max-width: 1300px){
        .container{ grid-template-columns:1fr; }
        .direita{ position:static; }
    }

    @media (max-width: 1100px){
        .grupos{ grid-template-columns:repeat(2,1fr); }
        .placar-linha{ grid-template-columns:1fr 1fr; }
        .placar-linha button{ grid-column:1 / -1; }
    }

    @media (max-width: 700px){
        .grupos{ grid-template-columns:1fr; }
        .linha-inputs{ grid-template-columns:1fr; }
        .linha-foto,
        .linha-fundo{ grid-template-columns:1fr; }
        .time-selecionado{ flex-direction:column; }
        .time-selecionado h2{ font-size:28px; }
        .campo{ min-height:620px; }
        .formacao{ height:420px; }
        .placar-linha{ grid-template-columns:1fr; }
    }
</style>
</head>
<body>

<div class="topo">
    <h1>🏆 COPA DO MUNDO 2026</h1>
    <div class="linha"></div>
</div>

<div class="container">
    <div class="painel esquerda">
        <div class="barra-acoes">
            <input type="text" id="pesquisa" placeholder="Pesquisar seleção..." oninput="filtrarSelecoes()">
            <button class="btn btn-cinza" onclick="limparBusca()">Limpar</button>
            <button class="btn btn-amarelo" onclick="sortearSelecao()">🎲 Sortear</button>
        </div>

        <div class="titulo-sec">Seleções</div>
        <div class="grupos" id="grupos"></div>
    </div>

    <div class="painel direita">
        <div class="time-selecionado">
            <div>
                <h2 id="nomeTime">Selecione uma seleção</h2>
                <div class="texto-ajuda">Clique em um jogador do campo para editar. Você pode digitar o nome que quiser e escolher a foto do computador.</div>
            </div>
            <div class="tag-grupo" id="grupoTime">Sem grupo</div>
        </div>

        <div class="placar">
            <h3>Placar</h3>
            <div class="placar-linha">
                <input type="text" id="adversario" placeholder="Adversário">
                <input type="number" id="golsTime" placeholder="Gols da seleção" min="0">
                <input type="number" id="golsAdversario" placeholder="Gols do adversário" min="0">
                <button class="btn btn-verde" onclick="salvarPlacar()">Salvar placar</button>
            </div>
            <div class="placar-box">
                <span>Resultado:</span>
                <strong id="placarResumo">0 x 0</strong>
            </div>
        </div>

        <div class="campo" id="campo">
            <div class="meio-campo"></div>
            <div class="formacao" id="formacao"></div>

            <div class="detalhes">
                <h3>Editar jogador</h3>

                <div class="linha-inputs">
                    <input type="text" id="nomeJogador" placeholder="Nome do jogador">
                    <input type="text" id="numeroJogador" placeholder="Número">
                    <select id="tipoJogador">
                        <option value="titular">Titular</option>
                        <option value="banco">Banco</option>
                    </select>
                </div>

                <div class="linha-foto">
                    <input type="file" id="fotoJogador" accept="image/*" onchange="carregarFoto(event)">
                    <div id="previewFoto" class="foto-preview-vazia">📷</div>
                </div>

                <div class="linha-fundo">
                    <input type="file" id="fundoCampo" accept="image/*" onchange="carregarFundoCampo(event)">
                    <div id="previewFundoCampo" class="mini-preview-fundo">Fundo do campo</div>
                </div>

                <div class="acoes-jogador">
                    <button class="btn btn-verde" onclick="salvarJogador()">Salvar jogador</button>
                    <button class="btn btn-azul" onclick="adicionarJogador()">Adicionar novo</button>
                    <button class="btn btn-cinza" onclick="limparTime()">Limpar time</button>
                    <button class="btn btn-amarelo" onclick="limparFundoCampo()">Limpar fundo</button>
                </div>

                <div class="lista">
                    <div class="caixa-lista">
                        <h4>Titulares</h4>
                        <ul id="listaTitulares"></ul>
                    </div>

                    <div class="caixa-lista">
                        <h4>Banco de reservas</h4>
                        <ul id="listaBanco"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const gruposData = [
    { nome:"GRUPO A", times:["Brasil","México","Japão","Canadá"] },
    { nome:"GRUPO B", times:["Argentina","França","Portugal","Alemanha"] },
    { nome:"GRUPO C", times:["Inglaterra","Espanha","Itália","Holanda"] },
    { nome:"GRUPO D", times:["Uruguai","Croácia","Bélgica","Estados Unidos"] },
    { nome:"GRUPO E", times:["Marrocos","Senegal","Nigéria","Egito"] },
    { nome:"GRUPO F", times:["Colômbia","Chile","Equador","Paraguai"] },
    { nome:"GRUPO G", times:["Coreia do Sul","Irã","Austrália","Arábia Saudita"] },
    { nome:"GRUPO H", times:["Suíça","Dinamarca","Polônia","Sérvia"] },
    { nome:"GRUPO I", times:["Costa Rica","Tunísia","Gana","Camarões"] },
    { nome:"GRUPO J", times:["Eslováquia","Escócia","Áustria","Noruega"] },
    { nome:"GRUPO K", times:["Bósnia","Turquia","Suécia","República Tcheca"] },
    { nome:"GRUPO L", times:["Jordânia","Uzbequistão","Nova Zelândia","Panamá"] }
];

const defaultRosters = {
    "Brasil": {
        titulares: [
            { numero:"1", nome:"Alisson" },
            { numero:"2", nome:"Danilo" },
            { numero:"3", nome:"Marquinhos" },
            { numero:"4", nome:"Militão" },
            { numero:"6", nome:"Renan Lodi" },
            { numero:"5", nome:"Casemiro" },
            { numero:"8", nome:"Bruno Guimarães" },
            { numero:"10", nome:"Neymar" },
            { numero:"7", nome:"Vinicius Jr" },
            { numero:"11", nome:"Rodrygo" },
            { numero:"9", nome:"Endrick" }
        ],
        banco: [
            { numero:"12", nome:"Bento" },
            { numero:"14", nome:"Martinelli" },
            { numero:"15", nome:"Bremer" }
        ],
        placar: { adversario:"", golsTime:0, golsAdversario:0 }
    }
};

let timeAtual = null;
let selecionado = { tipo:null, indice:null };
let fotoAtual = "";
let timeVirado = new Set();
let audioContext = null;

function criarTitularesVazios(){
    return Array.from({ length: 11 }, () => null);
}

function normalizarState(state){
    const titulares = criarTitularesVazios();
    if(Array.isArray(state.titulares)){
        state.titulares.forEach((jogador, i) => {
            if(i < 11) titulares[i] = jogador || null;
        });
    }

    return {
        titulares,
        banco: Array.isArray(state.banco) ? state.banco : [],
        campoFundo: typeof state.campoFundo === "string" ? state.campoFundo : "",
        placar: {
            adversario: state.placar?.adversario || "",
            golsTime: Number.isFinite(Number(state.placar?.golsTime)) ? Number(state.placar.golsTime) : 0,
            golsAdversario: Number.isFinite(Number(state.placar?.golsAdversario)) ? Number(state.placar.golsAdversario) : 0
        }
    };
}

function getState(time){
    const saved = localStorage.getItem("copa2026_" + time);
    if(saved){
        try{
            return normalizarState(JSON.parse(saved));
        }catch(e){
            return normalizarState({ titulares: [], banco: [], campoFundo: "", placar: {} });
        }
    }

    const base = defaultRosters[time] || { titulares: [], banco: [], placar: {} };
    const titulares = criarTitularesVazios();
    if(base.titulares){
        base.titulares.forEach((jogador, i) => {
            if(i < 11) titulares[i] = structuredClone(jogador);
        });
    }

    return {
        titulares,
        banco: base.banco ? structuredClone(base.banco) : [],
        campoFundo: "",
        placar: structuredClone(base.placar || { adversario:"", golsTime:0, golsAdversario:0 })
    };
}

function saveState(time, data){
    localStorage.setItem("copa2026_" + time, JSON.stringify(data));
}

function atualizarCampoFundo(fundo){
    const campo = document.getElementById("campo");
    const preview = document.getElementById("previewFundoCampo");

    if(fundo){
        campo.style.backgroundImage = `linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)), url('${fundo}')`;
        preview.textContent = "Fundo aplicado";
    }else{
        campo.style.backgroundImage = "linear-gradient(180deg, #22c55e 0%, #16a34a 100%)";
        preview.textContent = "Fundo do campo";
    }
}

function criarEfeitoClique(elemento, event){
    if(!elemento || !event) return;
    const rect = elemento.getBoundingClientRect();
    const ripple = document.createElement("span");
    ripple.className = "ripple";
    ripple.style.left = `${event.clientX - rect.left}px`;
    ripple.style.top = `${event.clientY - rect.top}px`;
    ripple.style.width = ripple.style.height = `${Math.max(rect.width, rect.height) * 0.45}px`;
    elemento.appendChild(ripple);
    setTimeout(() => ripple.remove(), 700);
}

function tocarSomGol(){
    try{
        if(!audioContext){
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        if(audioContext.state === "suspended"){
            audioContext.resume();
        }

        const now = audioContext.currentTime;
        const gain = audioContext.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
        gain.connect(audioContext.destination);

        const freqs = [220, 330, 440, 660];
        freqs.forEach((freq, i) => {
            const osc = audioContext.createOscillator();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            osc.connect(gain);
            osc.start(now + i * 0.08);
            osc.stop(now + 0.7);
        });
    }catch(err){
        console.warn("Não foi possível tocar o som de gol.", err);
    }
}

function virarCard(time){
    const estadoAtual = timeVirado.has(time);
    if(estadoAtual){
        timeVirado.delete(time);
    }else{
        timeVirado.add(time);
    }
    gerarGrupos(document.getElementById("pesquisa").value.trim() ? filtrarDados() : null);
}

function gerarGrupos(listaFiltrada = null){
    const container = document.getElementById("grupos");
    container.innerHTML = "";

    const data = listaFiltrada || gruposData;

    data.forEach(grupo => {
        const bloco = document.createElement("div");
        bloco.className = "grupo";

        let html = `<h2>${grupo.nome}</h2>`;

        grupo.times.forEach(time => {
            const state = getState(time);
            const ativo = timeAtual === time ? "ativo" : "";
            const virado = timeVirado.has(time) ? "virado" : "";
            const golsTime = state.placar?.golsTime ?? 0;
            const golsAdversario = state.placar?.golsAdversario ?? 0;
            const adversario = state.placar?.adversario || "Sem jogo";

            html += `
                <div class="time-wrap">
                    <button class="time ${ativo} ${virado}" onclick="virarCard('${time}'); selecionarTime('${time}', event)">
                        <div class="time-card">
                            <div class="time-face time-front">
                                <span class="icone-time">⚽</span>
                                <span>${time}</span>
                            </div>
                            <div class="time-face time-back">
                                <div class="placar-mini">${golsTime} x ${golsAdversario}</div>
                                <div class="placar-mini-texto">${adversario}</div>
                            </div>
                        </div>
                    </button>
                </div>
            `;
        });

        bloco.innerHTML = html;
        container.appendChild(bloco);
    });
}

function atualizarPreviewFoto(foto){
    const preview = document.getElementById("previewFoto");
    if(foto){
        preview.className = "foto-preview";
        preview.innerHTML = `<img src="${foto}" alt="Foto do jogador" class="foto-preview" />`;
    }else{
        preview.className = "foto-preview-vazia";
        preview.textContent = "📷";
    }
}

function limparCampos(){
    document.getElementById("nomeJogador").value = "";
    document.getElementById("numeroJogador").value = "";
    document.getElementById("tipoJogador").value = "titular";
    document.getElementById("fotoJogador").value = "";
    fotoAtual = "";
    atualizarPreviewFoto("");
}

function atualizarPlacarUI(state, animar = false){
    document.getElementById("adversario").value = state.placar?.adversario || "";
    document.getElementById("golsTime").value = state.placar?.golsTime ?? 0;
    document.getElementById("golsAdversario").value = state.placar?.golsAdversario ?? 0;

    const resumo = document.getElementById("placarResumo");
    resumo.textContent = `${state.placar?.golsTime ?? 0} x ${state.placar?.golsAdversario ?? 0}`;

    if(animar){
        resumo.classList.remove("animando");
        void resumo.offsetWidth;
        resumo.classList.add("animando");
        setTimeout(() => resumo.classList.remove("animando"), 400);
    }
}

function selecionarTime(time, event){
    if(event){
        criarEfeitoClique(event.currentTarget, event);
    }

    timeAtual = time;
    selecionado = { tipo:null, indice:null };
    fotoAtual = "";

    const grupo = gruposData.find(g => g.times.includes(time));
    document.getElementById("nomeTime").textContent = time;
    document.getElementById("grupoTime").textContent = grupo ? grupo.nome : "Sem grupo";

    const state = getState(time);
    atualizarCampoFundo(state.campoFundo || "");
    atualizarPlacarUI(state, false);

    limparCampos();
    renderizarTime();
    gerarGrupos(document.getElementById("pesquisa").value.trim() ? filtrarDados() : null);
}

function renderizarTime(){
    if(!timeAtual) return;

    const state = getState(timeAtual);
    const formacao = document.getElementById("formacao");
    const titulares = state.titulares;
    const banco = state.banco;

    let html = "";

    const mapaListras = [
        ["linha-formacao linha-1", 1],
        ["linha-formacao linha-4", 4],
        ["linha-formacao linha-3", 3],
        ["linha-formacao linha-3", 3]
    ];

    let idx = 0;
    mapaListras.forEach(([classe, qtde]) => {
        html += `<div class="${classe}">`;
        for(let i=0;i<qtde;i++){
            const jogador = titulares[idx];
            const nome = jogador?.nome || "Adicionar";
            const numero = jogador?.numero || "--";
            const foto = jogador?.foto || "";
            html += `
                <div class="jogador ${jogador ? "" : "vazio"} ${selecionado.tipo === 'titular' && selecionado.indice === idx ? 'selecionado-jogador' : ''}" onclick="editarSlot('titular', ${idx}, event)">
                    ${foto ? `<img src="${foto}" alt="${nome}" class="foto-jogador">` : `<div class="avatar-vazio">👤</div>`}
                    <span class="num">${numero}</span>
                    <span class="nome">${nome}</span>
                </div>
            `;
            idx++;
        }
        html += `</div>`;
    });

    formacao.innerHTML = html;

    const listaTitulares = document.getElementById("listaTitulares");
    const listaBanco = document.getElementById("listaBanco");

    listaTitulares.innerHTML = titulares.map((j, i) => {
        if(!j){
            return `
                <li onclick="editarSlot('titular', ${i}, event)">
                    <span>Vazio</span>
                    <span class="mini">editar</span>
                </li>
            `;
        }
        return `
            <li onclick="editarSlot('titular', ${i}, event)">
                <span>${j.numero || "--"} - ${j.nome || "Sem nome"}</span>
                <span class="mini">editar</span>
            </li>
        `;
    }).join("");

    if(!titulares.some(Boolean)){
        listaTitulares.innerHTML = `<div class="vazio-msg">Nenhum titular adicionado ainda.</div>`;
    }

    listaBanco.innerHTML = banco.length
        ? banco.map((j, i) => `
            <li onclick="editarSlot('banco', ${i}, event)">
                <span>${j.numero || "--"} - ${j.nome || "Sem nome"}</span>
                <span class="mini">editar</span>
            </li>
        `).join("")
        : `<div class="vazio-msg">Nenhum jogador no banco ainda.</div>`;
}

function editarSlot(tipo, indice, event){
    if(event) criarEfeitoClique(event.currentTarget, event);
    if(!timeAtual) return;

    const state = getState(timeAtual);
    const lista = state[tipo];
    const jogador = lista[indice];

    selecionado = { tipo, indice };

    document.getElementById("tipoJogador").value = tipo;

    if(jogador){
        document.getElementById("nomeJogador").value = jogador.nome || "";
        document.getElementById("numeroJogador").value = jogador.numero || "";
        fotoAtual = jogador.foto || "";
        atualizarPreviewFoto(fotoAtual);
    }else{
        document.getElementById("nomeJogador").value = "";
        document.getElementById("numeroJogador").value = "";
        fotoAtual = "";
        atualizarPreviewFoto("");
    }

    renderizarTime();
}

function carregarFoto(event){
    const arquivo = event.target.files[0];
    if(!arquivo) return;

    const leitor = new FileReader();
    leitor.onload = function(e){
        fotoAtual = e.target.result;
        atualizarPreviewFoto(fotoAtual);

        if(timeAtual && selecionado.tipo !== null && selecionado.indice !== null){
            const state = getState(timeAtual);

            if(!state[selecionado.tipo][selecionado.indice]){
                state[selecionado.tipo][selecionado.indice] = { nome:"", numero:"", foto:fotoAtual };
            }else{
                state[selecionado.tipo][selecionado.indice].foto = fotoAtual;
            }

            saveState(timeAtual, state);
            renderizarTime();
        }
    };
    leitor.readAsDataURL(arquivo);
}

function carregarFundoCampo(event){
    const arquivo = event.target.files[0];
    if(!arquivo) return;

    const leitor = new FileReader();
    leitor.onload = function(e){
        const fundo = e.target.result;
        atualizarCampoFundo(fundo);

        if(timeAtual){
            const state = getState(timeAtual);
            state.campoFundo = fundo;
            saveState(timeAtual, state);
        }
    };
    leitor.readAsDataURL(arquivo);
}

function limparFundoCampo(){
    if(!timeAtual) return;

    const state = getState(timeAtual);
    state.campoFundo = "";
    saveState(timeAtual, state);
    atualizarCampoFundo("");
    document.getElementById("fundoCampo").value = "";
}

function salvarPlacar(){
    if(!timeAtual){
        alert("Selecione uma seleção primeiro.");
        return;
    }

    const adversario = document.getElementById("adversario").value.trim();
    const golsTime = Number(document.getElementById("golsTime").value || 0);
    const golsAdversario = Number(document.getElementById("golsAdversario").value || 0);

    const state = getState(timeAtual);
    const golsAntes = Number(state.placar?.golsTime || 0);

    state.placar = {
        adversario,
        golsTime: Number.isFinite(golsTime) ? Math.max(0, golsTime) : 0,
        golsAdversario: Number.isFinite(golsAdversario) ? Math.max(0, golsAdversario) : 0
    };

    saveState(timeAtual, state);
    atualizarPlacarUI(state, true);

    if(state.placar.golsTime > golsAntes){
        tocarSomGol();
    }

    gerarGrupos(document.getElementById("pesquisa").value.trim() ? filtrarDados() : null);
}

function salvarJogador(){
    if(!timeAtual){
        alert("Selecione uma seleção primeiro.");
        return;
    }

    const nome = document.getElementById("nomeJogador").value.trim();
    const numero = document.getElementById("numeroJogador").value.trim();
    const tipo = document.getElementById("tipoJogador").value;

    if(!nome){
        alert("Digite o nome do jogador.");
        return;
    }

    const state = getState(timeAtual);

    if(selecionado.tipo && selecionado.indice !== null && tipo === selecionado.tipo){
        state[tipo][selecionado.indice] = {
            nome,
            numero,
            foto: fotoAtual || state[tipo][selecionado.indice]?.foto || ""
        };
    }else{
        if(tipo === "titular"){
            const indiceVazio = state.titulares.findIndex(j => !j);
            if(indiceVazio === -1){
                alert("O time já tem 11 titulares. Edite um slot ou mova para o banco.");
                return;
            }
            state.titulares[indiceVazio] = { nome, numero, foto: fotoAtual };
        }else{
            state.banco.push({ nome, numero, foto: fotoAtual });
        }
    }

    saveState(timeAtual, state);
    renderizarTime();

    selecionado = { tipo:null, indice:null };
    limparCampos();
}

function adicionarJogador(){
    if(!timeAtual){
        alert("Selecione uma seleção primeiro.");
        return;
    }

    const tipo = document.getElementById("tipoJogador").value;
    const nome = document.getElementById("nomeJogador").value.trim();
    const numero = document.getElementById("numeroJogador").value.trim();

    if(!nome){
        alert("Digite o nome do jogador.");
        return;
    }

    const state = getState(timeAtual);

    if(tipo === "titular"){
        const indiceVazio = state.titulares.findIndex(j => !j);
        if(indiceVazio === -1){
            alert("Já existem 11 titulares. Clique em um slot para editar.");
            return;
        }
        state.titulares[indiceVazio] = { nome, numero, foto: fotoAtual };
    }else{
        state.banco.push({ nome, numero, foto: fotoAtual });
    }

    saveState(timeAtual, state);
    renderizarTime();

    selecionado = { tipo:null, indice:null };
    limparCampos();
}

function limparTime(){
    if(!timeAtual) return;
    if(!confirm("Quer apagar a escalação dessa seleção?")) return;

    localStorage.removeItem("copa2026_" + timeAtual);
    atualizarCampoFundo("");
    document.getElementById("fundoCampo").value = "";
    document.getElementById("adversario").value = "";
    document.getElementById("golsTime").value = 0;
    document.getElementById("golsAdversario").value = 0;
    document.getElementById("placarResumo").textContent = "0 x 0";
    renderizarTime();
    limparCampos();
}

function filtrarDados(){
    const termo = document.getElementById("pesquisa").value.trim().toLowerCase();

    if(!termo) return null;

    return gruposData.map(grupo => ({
        nome: grupo.nome,
        times: grupo.times.filter(time => time.toLowerCase().includes(termo))
    })).filter(grupo => grupo.times.length > 0);
}

function filtrarSelecoes(){
    gerarGrupos(filtrarDados());
}

function limparBusca(){
    document.getElementById("pesquisa").value = "";
    gerarGrupos();
}

function sortearSelecao(){
    const todas = gruposData.flatMap(g => g.times);
    const sorteada = todas[Math.floor(Math.random() * todas.length)];
    selecionarTime(sorteada);
}

function runSelfTests(){
    console.assert(criarTitularesVazios().length === 11, "Teste: titulares vazios deve ter 11 posições");
    const s = normalizarState({ titulares:[{nome:"A"}], banco:null, placar:{ golsTime:"2", golsAdversario:"1" } });
    console.assert(Array.isArray(s.titulares) && s.titulares.length === 11, "Teste: normalizarState deve manter 11 titulares");
    console.assert(s.placar.golsTime === 2 && s.placar.golsAdversario === 1, "Teste: placar deve ser numérico");
}

Array.from(document.querySelectorAll('.btn')).forEach(btn => {
    btn.addEventListener('click', (e) => criarEfeitoClique(btn, e));
});

gerarGrupos();
selecionarTime("Brasil");
runSelfTests();
</script>
